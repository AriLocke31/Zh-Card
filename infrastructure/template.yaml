AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Zh-Card JWT-protected HTTP API using an existing DynamoDB table and Cognito pool
Parameters:
  TableName:
    Type: String
    Description: Existing table with a string partition key named id and no sort key
  OwnerSub:
    Type: String
    Description: Cognito user sub allowed to access the dictionary
    Default: a448a4b8-7001-7026-be60-4ab12223fd3a
  JwtIssuer:
    Type: String
    Default: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_gCGZV3F39
  ClientId:
    Type: String
    Default: dtirh82840p4fm4q0rc88n5t7
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: Browser origins allowed by CORS, e.g. http://localhost:5173
Resources:
  WordsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefinitionBody:
        openapi: '3.0.1'
        info: { title: Zh-Card, version: '1.0' }
        paths: {}
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type, If-Match]
      Auth:
        DefaultAuthorizer: ZhCardCognito
        Authorizers:
          ZhCardCognito:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Ref JwtIssuer
              audience: [!Ref ClientId]
            AuthorizationScopes: [openid]
  WordsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      CodeUri: ../src/backend/dist/
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          OWNER_SUB: !Ref OwnerSub
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Scan, dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}'
      Events:
        ListWords:
          Type: HttpApi
          Properties: { ApiId: !Ref WordsApi, Path: /words, Method: GET }
        CreateWord:
          Type: HttpApi
          Properties: { ApiId: !Ref WordsApi, Path: /words, Method: POST }
        GetWord:
          Type: HttpApi
          Properties: { ApiId: !Ref WordsApi, Path: '/words/{id}', Method: GET }
        UpdateWord:
          Type: HttpApi
          Properties: { ApiId: !Ref WordsApi, Path: '/words/{id}', Method: PUT }
        DeleteWord:
          Type: HttpApi
          Properties: { ApiId: !Ref WordsApi, Path: '/words/{id}', Method: DELETE }
Outputs:
  ApiBaseUrl:
    Value: !Sub 'https://${WordsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  FunctionName:
    Value: !Ref WordsFunction
